<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1f3d" />
    <title>VELOCITY ISLAND — جزيرة السرعة</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; padding: 0; overflow: hidden; background: #0c1f3d; height: 100%; width: 100%; }
      #app { position: fixed; inset: 0; }
      #webgl-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #boot-fallback { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #faf6ee; font-family: system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="webgl-canvas"></canvas>
    </div>
    <noscript>
      <div id="boot-fallback">JavaScript is required to play VELOCITY ISLAND.</div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
