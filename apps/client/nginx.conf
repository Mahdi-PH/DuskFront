server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # WASM needs the right MIME type for the browser's WebAssembly.instantiateStreaming.
    types {
        application/wasm wasm;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
