name: Android APK Release

# Builds the Capacitor-wrapped Android APK and attaches it to a GitHub
# Release. Runs on GitHub-hosted runners because they have unrestricted
# internet access to the Android SDK/Google Maven, which this repo's own
# dev sandbox does not.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (defaults to the ref that triggered this run)'
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web client
        run: npm run build:client

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform/build-tools
        run: |
          sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android project
        working-directory: apps/client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find apps/client/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-island-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Velocity Island ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ### Velocity Island — Android build

            Debug-signed APK (Android's default debug key). Install with
            "unknown sources" enabled; not eligible for the Play Store as-is.

            Single-player / bot races work fully offline. Online multiplayer
            requires a reachable server — this build points at
            `http://localhost:2567` by default, which only resolves on the
            device itself. To ship a build wired to a real server, set
            `VITE_SERVER_HTTP_URL` / `VITE_SERVER_WS_URL` before building the
            client (see the project README).
