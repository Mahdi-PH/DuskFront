name: Android APK Release

# Builds the Capacitor-wrapped Android APK and attaches it to a GitHub
# Release. Runs on GitHub-hosted runners because they have unrestricted
# internet access to the Android SDK/Google Maven, which this repo's own
# dev sandbox does not.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish as (e.g. v1.0.0). Defaults to the triggering ref name.'
        required: false

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Always build the ref that triggered the run (branch for manual
          # dispatch, the tag itself for a tag push). `inputs.tag` on manual
          # dispatch is only a release *name* to publish under — it may not
          # exist as a git ref yet, so it must never be used for checkout.
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli@8.5.2 requires Node >=22.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build web client
        run: npm run build:client

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK cmdline-tools
        # android-actions/setup-android@v3 unconditionally runs
        # `sdkmanager tools`, which Google removed from the repository years
        # ago (replaced by cmdline-tools) -- that call now fails outright and
        # takes the whole step down with it. Installing cmdline-tools
        # ourselves sidesteps that bug entirely.
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required SDK platform/build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync Capacitor Android project
        working-directory: apps/client
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/client/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find apps/client/android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: velocity-island-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Velocity Island ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ### Velocity Island — Android build

            Debug-signed APK (Android's default debug key). Install with
            "unknown sources" enabled; not eligible for the Play Store as-is.

            Single-player / bot races work fully offline. Online multiplayer
            requires a reachable server — this build points at
            `http://localhost:2567` by default, which only resolves on the
            device itself. To ship a build wired to a real server, set
            `VITE_SERVER_HTTP_URL` / `VITE_SERVER_WS_URL` before building the
            client (see the project README).
